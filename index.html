<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Strays</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Night sky + moon behind everything -->
  <div class="night-sky"></div>
  <div class="moon" aria-hidden="true">
    <div class="moon-glow"></div>
    <div class="moon-face"></div>
  </div>

  <!-- Forest treeline silhouetted against the moon -->
  <svg class="treeline" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <path id="fir" d="M0,-122 L13,-88 L6,-88 L19,-56 L9,-56 L27,-20 L5,-20 L5,0 L-5,0 L-5,-20 L-27,-20 L-9,-56 L-19,-56 L-6,-88 L-13,-88 Z" />
    </defs>
    <g class="tree-fill">
      <use href="#fir" transform="translate(40,300) scale(1.0)" />
      <use href="#fir" transform="translate(96,300) scale(0.68)" />
      <use href="#fir" transform="translate(150,300) scale(1.28)" />
      <use href="#fir" transform="translate(214,300) scale(0.86)" />
      <use href="#fir" transform="translate(276,300) scale(1.02)" />
      <use href="#fir" transform="translate(330,300) scale(0.64)" />
      <use href="#fir" transform="translate(386,300) scale(1.16)" />
      <use href="#fir" transform="translate(450,300) scale(0.9)" />
      <use href="#fir" transform="translate(516,300) scale(1.4)" />
      <use href="#fir" transform="translate(586,300) scale(0.8)" />
      <use href="#fir" transform="translate(646,300) scale(1.06)" />
      <use href="#fir" transform="translate(706,300) scale(0.7)" />
      <use href="#fir" transform="translate(766,300) scale(1.22)" />
      <use href="#fir" transform="translate(832,300) scale(0.95)" />
      <use href="#fir" transform="translate(896,300) scale(1.42)" />
      <use href="#fir" transform="translate(966,300) scale(0.84)" />
      <use href="#fir" transform="translate(1026,300) scale(1.1)" />
      <use href="#fir" transform="translate(1092,300) scale(0.72)" />
      <use href="#fir" transform="translate(1152,300) scale(1.05)" />
    </g>
    <g class="tree-stroke">
      <g transform="translate(70,300) scale(0.95)">
        <path d="M0,0 L0,-158" />
        <path d="M0,-64 L-26,-102 M0,-72 L22,-104" />
        <path d="M0,-104 L-18,-134 M0,-98 L24,-138" />
        <path d="M0,-128 L-13,-152 M0,-132 L15,-158" />
        <path d="M-26,-102 l-12,-18 M22,-104 l14,-16 M-18,-134 l-9,-14 M24,-138 l11,-12" />
      </g>
      <g transform="translate(1118,300) scale(1.05)">
        <path d="M0,0 L0,-150" />
        <path d="M0,-58 L24,-96 M0,-66 L-20,-98" />
        <path d="M0,-96 L16,-126 M0,-90 L-22,-130" />
        <path d="M0,-120 L12,-146 M0,-124 L-14,-150" />
        <path d="M24,-96 l12,-16 M-20,-98 l-13,-15 M16,-126 l9,-13 M-22,-130 l-10,-12" />
      </g>
      <g transform="translate(410,300) scale(0.8)">
        <path d="M0,0 L0,-132" />
        <path d="M0,-56 L-20,-88 M0,-62 L18,-90" />
        <path d="M0,-92 L-14,-118 M0,-86 L18,-120" />
        <path d="M-20,-88 l-9,-13 M18,-90 l11,-12" />
      </g>
    </g>
  </svg>

  <!-- Ambient overlays -->
  <div class="vignette"></div>
  <div class="dust"></div>

  <!-- Fog blows through the whole page -->
  <canvas id="fog" aria-hidden="true"></canvas>

  <!-- Enter gate -->
  <div id="gate" class="gate">
    <div class="gate-inner">
      <h1 class="gate-title">The Strays</h1>
      <svg class="flourish flourish-divider" viewBox="0 0 240 40" aria-hidden="true">
        <use href="#filigree" />
      </svg>
      <p class="gate-sub">The History of Redding</p>
      <button id="enterBtn" class="enter-btn" type="button">Enter</button>
    </div>
  </div>

  <!-- The book -->
  <div class="stage" id="stage">
    <div class="book" id="book">
      <!-- Left page of the spread (revealed when open) -->
      <div class="left-page">
        <div class="page-sheet">
          <div class="left-decor">
            <div class="sigil">&#9790;</div>
            <div class="left-lines">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right page: the passage is revealed here -->
      <div class="right-page">
        <div class="page-sheet">
          <div class="page-content">
            <p class="incantation" id="incantation"></p>
            <p class="whisper">&mdash; from the diaries of the pack</p>
          </div>
        </div>
      </div>

      <!-- Turning pages (flip away to reveal the right page) -->
      <div class="page page-2"><div class="page-face front"></div><div class="page-face back"></div></div>
      <div class="page page-1"><div class="page-face front"></div><div class="page-face back"></div></div>

      <!-- Front cover -->
      <div class="cover" id="cover">
        <div class="cover-face cover-front">
          <img class="cover-img" src="assets/cover.jpg" alt="The Strays — an old leather book bearing a snarling werewolf" />
          <div class="cover-sheen"></div>
        </div>
        <div class="cover-face cover-back"></div>
      </div>
    </div>
  </div>

  <!-- Reusable Victorian filigree flourish -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8a6d2f" />
        <stop offset="50%" stop-color="#e6c877" />
        <stop offset="100%" stop-color="#8a6d2f" />
      </linearGradient>
      <g id="filigree" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round">
        <path d="M120 20 C 104 9, 84 9, 72 20 C 64 28, 52 28, 46 20" />
        <path d="M120 20 C 136 9, 156 9, 168 20 C 176 28, 188 28, 194 20" />
        <path d="M46 20 C 40 14, 30 15, 30 22 C 30 27, 36 28, 39 24" />
        <path d="M194 20 C 200 14, 210 15, 210 22 C 210 27, 204 28, 201 24" />
        <path d="M72 20 c 3 -7 11 -8 14 -2" />
        <path d="M168 20 c -3 -7 -11 -8 -14 -2" />
        <circle cx="120" cy="20" r="3.4" fill="url(#goldGrad)" stroke="none" />
        <path d="M113 20 h14" stroke-width="1" />
        <circle cx="30" cy="22" r="1.7" fill="url(#goldGrad)" stroke="none" />
        <circle cx="210" cy="22" r="1.7" fill="url(#goldGrad)" stroke="none" />
      </g>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
